<nav class="nav-menu">
  @for (item of navItems; track item.link) {
    <a [routerLink]="item.link" 
       routerLinkActive="active" 
     
       [routerLinkActiveOptions]="item.link === '/main-layout/dashboard' ? { exact: true } : { exact: false }"
       class="nav-item">
      
      <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.icon" />
      </svg>
      <span>{{ item.label }}</span>
    </a>
  }

</nav>

  <!-- Sidebar Footer -->
  <div class="sidebar-footer">
    <a routerLink="/reports" routerLinkActive="active" class="reports-badge">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z" />
      </svg>
      <span>VIEW REPORTS</span>
    </a>
  </div>
</aside>
