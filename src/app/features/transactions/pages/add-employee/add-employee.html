<div class="add-employee-container">

    <!-- Header & Breadcrumbs Section -->
    <app-page-header title="Add Employee" breadcrumb="Employees"></app-page-header>

    <!-- Success Toast Notification -->
    <!-- @if (showSuccessBanner()) {
        <div class="success-banner">
            <span class="icon-check">✓</span>
            <span class="banner-text">Employee created successfully.</span>
            <button type="button" class="close-btn" (click)="dismissBanner()">×</button>
        </div>
        } -->

    <!-- Main Form Card -->
    <div class="card form-card">
        <form [formGroup]="employeeForm" (ngSubmit)="onSubmit()" class="employee-form">

            <div class="form-grid">

                <!-- Row 1: Employee ID & Employee Name -->
                <!-- <div class="form-group">
                    <label>Employee ID</label>
                    <input type="text" formControlName="employeeId" placeholder="EMP001" class="form-control"
                        [class.is-invalid]="isFieldInvalid('employeeId')" />
                    @if (hasError('employeeId', 'required')) {
                    <span class="error-msg">Employee ID is required.</span>
                    }
                </div> -->

                <div class="form-group">
                    <app-input label="Employee Name" placeholder="Full Name" [required]="true"
                        formControlName="employeeName"></app-input>
                </div>

                <!-- Row 2: Email & Phone Number -->
                <div class="form-group">
                    <app-input label="Email" placeholder="name@hdfc.com" type="email" [required]="true"
                        formControlName="email"></app-input>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <div class="phone-input-wrapper">
                        <span class="prefix">+91</span>
                        <input type="text" formControlName="phoneNumber" placeholder="0000000000"
                            class="form-control pl-12" [class.is-invalid]="isFieldInvalid('phone')" />
                    </div>
                    @if (isFieldInvalid('phone')) {
                    <app-form-error message="Invalid phone number."></app-form-error>
                    }
                </div>

                <!-- Row 3: Department & Designation -->
                <div class="form-group">
                    <app-select-component label="Department" placeholder="Select Department..."
                        [options]="departmentOptions" [required]="true" formControlName="department">
                    </app-select-component>
                </div>

                <div class="form-group">
                    <app-input label="Designation" placeholder="Role Title" [required]="true"
                        formControlName="designation"></app-input>
                </div>

                <!-- Row 4: Date of Joining & Salary -->
                <div class="form-group">
                    <label>Date of Joining</label>
                    <input type="date" formControlName="dateOfJoining" class="form-control"
                        [class.is-invalid]="isFieldInvalid('dateOfJoining')" />
                    @if (hasError('dateOfJoining', 'futureDate')) {
                    <app-form-error message="Date cannot be in the future."></app-form-error>
                    } @else if (hasError('dateOfJoining', 'required')) {
                    <app-form-error message="Date of joining is required."></app-form-error>
                    }
                </div>

                <div class="form-group">
                    <label>Salary</label>
                    <div class="currency-input-wrapper">
                        <span class="currency-symbol">₹</span>
                        <input type="number" formControlName="salary" placeholder="0.00" class="form-control pl-8"
                            [class.is-invalid]="isFieldInvalid('salary')" />
                    </div>
                    @if (isFieldInvalid('salary')) {
                    <app-form-error message="Salary must be a positive number."></app-form-error>
                    }
                </div>

            </div>

            <!-- Row 5: Status Radio Selection -->
            <div class="status-group">
                <label class="status-label">Status</label>
                <div class="radio-options">
                    <label class="radio-item">
                        <input type="radio" formControlName="employeeStatus" value="ACTIVE" />
                        <span>Active</span>
                    </label>
                    <label class="radio-item">
                        <input type="radio" formControlName="employeeStatus" value="INACTIVE" />
                        <span>Inactive</span>
                    </label>
                </div>
            </div>

            <!-- Form Actions -->
            <app-form-actions submitLabel="Save Employee" [busy]="isSubmitting()"
                (cancelled)="onCancel()"></app-form-actions>

        </form>
    </div>

</div>
