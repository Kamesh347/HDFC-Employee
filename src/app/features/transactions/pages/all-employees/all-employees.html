<div class="employee-list-container">

  <!-- Top Header Section -->
  <app-page-header title="Employees" subtitle="Manage employee information.">
    <button headerActions (click)="navigateToAddEmployee()" class="btn-add-employee">
      <span>Add Employee</span>
      <span class="plus-icon">+</span>
    </button>
  </app-page-header>

  <!-- Filter Card Bar -->
  <div class="card filter-card">
    <div class="filters-row">

      <!-- Search Field -->
      <div class="filter-group search-group">
        <app-search-field placeholder="Search employee" [value]="searchQuery()"
          (valueChange)="updateSearch($event)"></app-search-field>
      </div>

      <!-- Employee ID Filter -->
      <div class="filter-group">
        <label>Employee ID filter</label>
        <app-select-component placeholder="Employee ID filter" [options]="employeeIdFilterOptions"
          [ngModel]="selectedEmpIdFilter()" (ngModelChange)="selectedEmpIdFilter.set($event)">
        </app-select-component>
      </div>

      <!-- Department Filter -->
      <div class="filter-group">
        <label>Department filter</label>
        <app-select-component placeholder="IT, HR, Operations" [options]="departmentFilterOptions"
          [ngModel]="selectedDepartmentFilter()" (ngModelChange)="selectedDepartmentFilter.set($event)">
        </app-select-component>
      </div>

      <!-- Status Filter -->
      <div class="filter-group">
        <label>Status filter</label>
        <app-select-component placeholder="Active, Inactive" [options]="statusFilterOptions"
          [ngModel]="selectedStatusFilter()" (ngModelChange)="selectedStatusFilter.set($event)">
        </app-select-component>
      </div>

      <!-- Clear Filters Link -->
      <div class="clear-filters-wrapper">
        <a (click)="clearFilters()" class="clear-filters-link">Clear filters</a>
      </div>

    </div>

    <!-- Data Table -->
    <div class="table-responsive">
      <table class="data-table">
        <thead>
          <tr>
            <th>Employee ID <span class="sort-icon">↑</span></th>
            <th>Employee Name</th>
            <th>Email</th>
            <th>Phone <span class="sort-icon">⇅</span></th>
            <th>Department <span class="sort-icon">⇅</span></th>
            <th>Designation</th>
            <th>Status <span class="sort-icon">⇅</span></th>
            <th class="text-center">Actions</th>
          </tr>
        </thead>
        <tbody>
          @for (emp of paginatedEmployees(); track emp.id) {
          <tr>
            <td class="font-medium">{{ emp.id }}</td>
            <td>{{ emp.employeeName }}</td>
            <td>{{ emp.email }}</td>
            <td>{{ emp.phoneNumber }}</td>
            <td>{{ emp.department }}</td>
            <td>{{ emp.designation }}</td>
            <td>
              <app-status-badge [label]="emp.employeeStatus"
                [tone]="emp.employeeStatus === 'Active' ? 'success' : 'danger'"></app-status-badge>
            </td>
            <td>
              <!-- Actions buttons block complete karein -->
              <button (click)="onView(emp)">View</button>
              <button (click)="onEdit(emp)">Edit</button>
              <button (click)="confirmDelete(emp)">Delete</button>
            </td>
          </tr>
          }
        </tbody>
      </table>
    </div>

    <!-- Pagination Footer -->
    <app-pagination [currentPage]="currentPage()" [totalItems]="filteredEmployees().length" [pageSize]="pageSize()"
      (pageChange)="updatePage($event)"></app-pagination>

  </div>

</div>

<!-- Delete Confirmation Modal Overlay -->
@if (showDeleteModal()) {
<app-confirm-dialog title="Delete employee" message="Are you sure you want to delete this employee?"
  confirmLabel="Delete" [busy]="isLoading()" (cancelled)="closeDeleteModal()" (confirmed)="executeDelete()">
</app-confirm-dialog>
}
