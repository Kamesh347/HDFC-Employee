<div class="add-income-container">

  <app-page-header title="Add Income" breadcrumb="Income"></app-page-header>





  <!-- Form Card Container -->
  <div class="card form-card">
    <form [formGroup]="incomeForm" (ngSubmit)="onSubmit()" class="income-form">


      <!-- Employee Field -->
      <div class="form-group">
        <label>Employee <span class="required">*</span></label>
        <app-select-component label="Employee" placeholder="Select Employee..." [options]="employeeOptions"
          [required]="true" formControlName="employeeId">
        </app-select-component>
      </div>

      <!-- Income Source -->
      <div class="form-group">
        <app-input label="Income Source" placeholder="e.g., Client Name or Company" [required]="true"
          formControlName="incomeSource"></app-input>
      </div>

      <!-- Income Category -->
      <div class="form-group">
        <label>Income Category <span class="required">*</span></label>
        <app-select-component label="Income Category" placeholder="Select category..." [options]="categoryOptions"
          [required]="true" formControlName="category">
        </app-select-component>
      </div>

      <!-- Amount -->
      <div class="form-group">
        <label>Amount <span class="required">*</span></label>
        <div class="currency-input-wrapper">
          <span class="currency-symbol">₹</span>
          <input type="number" formControlName="amount" placeholder="0.00" class="form-control pl-8"
            [class.is-invalid]="isFieldInvalid('amount')" />
        </div>
        @if (isFieldInvalid('amount')) {
        <app-form-error message="Amount must be greater than zero."></app-form-error>
        }
      </div>

      <!-- Income Date -->
      <div class="form-group">
        <label>Income Date <span class="required">*</span></label>
        <input type="date" formControlName="incomeDate" class="form-control"
          [class.is-invalid]="isFieldInvalid('incomeDate')" />
        @if (isFieldInvalid('incomeDate')) {
        <app-form-error message="Date is required."></app-form-error>
        }
      </div>

      <!-- Payment Method -->
      <div class="form-group">
        <label>Payment Method <span class="required">*</span></label>
        <app-select-component label="Payment Method" placeholder="Select payment method..."
          [options]="paymentMethodOptions" [required]="true" formControlName="paymentMethod">
        </app-select-component>
      </div>

      <!-- Description -->
      <div class="form-group">
        <label>Description</label>
        <textarea formControlName="description" rows="3" placeholder="Add details about the income... (optional)"
          class="form-control textarea"></textarea>
      </div>

      <!-- Form Action Buttons -->
      <app-form-actions submitLabel="Save Income" [busy]="isSubmitting()" (cancelled)="onCancel()"></app-form-actions>

    </form>
  </div>

</div>
