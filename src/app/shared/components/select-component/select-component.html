<div class="select-wrapper" [class.has-error]="errorMessage" [class.is-disabled]="disabled">
  <!-- Label -->
  <label *ngIf="label" class="select-label">
    {{ label }} <span *ngIf="required" class="required-asterisk">*</span>
  </label>

  <div class="select-container" (focusout)="onFocusOut($event)">
    <input type="text" class="form-select" role="combobox" aria-autocomplete="list" aria-haspopup="listbox"
      [attr.aria-expanded]="isOpen" [attr.aria-required]="required" [attr.aria-invalid]="!!errorMessage"
      [value]="searchText" [placeholder]="placeholder" [disabled]="disabled" (focus)="onFocus()"
      (input)="onSearch($event)" (keydown)="onKeydown($event)" />
    @if (isOpen) {
    <div class="options-list" role="listbox">
      @for (option of filteredOptions; track option.value) {
      <button type="button" class="option-item" role="option" [attr.aria-selected]="option.value === selectedValue"
        [disabled]="option.disabled" (click)="selectOption(option)">
        {{ option.label }}
      </button>
      } @empty {
      <div class="no-options">No matching options</div>
      }
    </div>
    }
  </div>

  <!-- Helper Text / Validation Error -->
  <div class="select-footer">
    <span *ngIf="errorMessage" class="error-message">{{ errorMessage }}</span>
    <span *ngIf="!errorMessage && helperText" class="helper-text">{{ helperText }}</span>
  </div>
</div>
