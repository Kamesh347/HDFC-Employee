<span class="status-badge" [class.tone-neutral]="tone === 'neutral'" [class.tone-success]="tone === 'success'"
    [class.tone-pending]="tone === 'pending'" [class.tone-danger]="tone === 'danger'"
    [class.tone-income]="tone === 'income'" [class.tone-expense]="tone === 'expense'">
    {{ label }}
</span>
